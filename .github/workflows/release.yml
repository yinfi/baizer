name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # 凭据守卫（与 ci.yml 同一步，此处是发布前的最后一道）：tag 可以直接推送，
      # 未必经过 CI。发布是本仓库唯一会把内置 token 送到所有用户手上的动作，
      # 在它之前再确认一次「token 没有进任何被追踪的文件」。
      - name: Guard against committed credentials
        run: |
          if git grep -nEI 'github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}' -- . ; then
            echo "::error::A GitHub credential pattern was found in a tracked file. Tokens must never enter git."
            exit 1
          fi
          echo "No credential patterns in tracked files."

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npx eslint .

      - name: Verify tag matches manifest version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match manifest.json version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Create Release draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
