name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 凭据守卫：反馈功能的内置 token 只能来自构建期 secret，绝不能进任何被追踪
      # 的文件。一旦进 git，GitHub 的 secret scanning 会自动撤销它，而现象是
      # 「昨天还好，今天所有用户静默 401」——无人干预也会挂，极难定位。
      # 放在最前面：命中即快速失败，不必等 npm ci / build。
      - name: Guard against committed credentials
        run: |
          if git grep -nEI 'github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}' -- . ; then
            echo "::error::A GitHub credential pattern was found in a tracked file. Tokens must never enter git."
            exit 1
          fi
          echo "No credential patterns in tracked files."

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # eslint 目前 0 error / 若干 any 警告,所以这一步是阻断式的:
      # 新引入的 error 会让 CI 失败,而已有的警告不会。
      - name: Lint
        run: npx eslint .

      # 类型检查暂不阻断:main 上仍有已知的类型债(未使用变量 + 少量未标注的
      # Obsidian API 访问)。报错在 CI 日志里保持可见,清理它是 good first issue。
      # 债清零后请删掉 `|| true`。
      - name: Type check (non-blocking, known debt)
        run: npx tsc --noEmit || true
