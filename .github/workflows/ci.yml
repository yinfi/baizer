name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Lint 与类型检查为信息性步骤:当前仍有已知的 any / Obsidian API 类型债,
      # 不阻断合并,但在 CI 日志中保持可见,便于逐步收敛。
      - name: Lint (non-blocking)
        run: npx eslint . || true

      - name: Type check (non-blocking)
        run: npx tsc --noEmit || true
