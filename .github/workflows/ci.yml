name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # eslint 目前 0 error / 若干 any 警告,所以这一步是阻断式的:
      # 新引入的 error 会让 CI 失败,而已有的警告不会。
      - name: Lint
        run: npx eslint .

      # 类型检查暂不阻断:main 上仍有已知的类型债(未使用变量 + 少量未标注的
      # Obsidian API 访问)。报错在 CI 日志里保持可见,清理它是 good first issue。
      # 债清零后请删掉 `|| true`。
      - name: Type check (non-blocking, known debt)
        run: npx tsc --noEmit || true
