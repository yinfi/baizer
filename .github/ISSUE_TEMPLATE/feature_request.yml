name: Feature request
description: Suggest something Baizer should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The most useful requests start from the problem, not the solution. What
        are you trying to do in your vault that Baizer makes hard right now?

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to accomplish, and where you get stuck.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. If you already have a shape in mind, describe it.

  - type: textarea
    id: workaround
    attributes:
      label: How you handle it today
      description: Another plugin, a manual routine, or nothing at all.

  - type: dropdown
    id: surface
    attributes:
      label: Which part of Baizer
      options:
        - Workbench (chat)
        - Guardian (inline completions)
        - Skills / tools
        - Knowledge Wiki
        - Memory
        - Settings
        - Something new
    validations:
      required: true
