<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倾斜摄影建模流程</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #eef3f4;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", "PingFang SC", "Source Han Sans SC", sans-serif;
    }

    .frame {
      width: 1400px;
      box-shadow: 0 18px 44px rgba(19, 53, 71, 0.16);
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
    }

    img {
      display: block;
      width: 1400px;
      height: 1900px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <img src="./oblique-photogrammetry-workflow.svg" alt="倾斜摄影建模流程图">
  </div>
</body>
</html>
